{% extends "base.html" %}

{% block content %}

<h2>My Profile</h2>

<form method="POST">

{{ form.hidden_tag() }}

<div class="mb-3">

{{ form.name.label }}

{{ form.name(class="form-control") }}

</div>

<div class="mb-3">

{{ form.phone.label }}

{{ form.phone(class="form-control") }}

</div>

{{ form.submit(class="btn btn-primary") }}

</form>
<a href="{{ url_for('user.dashboard') }}" class="btn btn-secondary mt-3">
    ← Back
</a>

{% endblock %}
