{% extends "base.html" %}

{% block title %}
Staff Dashboard
{% endblock %}

{% block content %}

<h2>Staff Dashboard</h2>
<a href="{{ url_for('staff.profile') }}"
   class="btn btn-success mb-3">

    My Profile

</a>

<div class="row">

{% for trek in assigned_treks %}

<div class="col-md-4">

<div class="card shadow mb-3">

<div class="card-body">

<h4>{{ trek.name }}</h4>

<p>{{ trek.location }}</p>

<p>Status : {{ trek.status }}</p>

<a href="{{ url_for('staff.assigned_treks') }}"
class="btn btn-primary">

Manage

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
