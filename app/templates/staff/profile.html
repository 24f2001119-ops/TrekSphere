{% extends "base.html" %}

{% block title %}
Staff Profile
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3>My Profile</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {{ form.hidden_tag() }}

                        <div class="mb-3">

                            {{ form.name.label }}

                            {{ form.name(class="form-control") }}

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ current_user.email }}"
                                readonly>

                        </div>

                        <div class="mb-3">

                            {{ form.phone.label }}

                            {{ form.phone(class="form-control") }}

                        </div>

                        <div class="mb-3">

                            <label>Role</label>

                            <input
                                type="text"
                                class="form-control"
                                value="Trek Staff"
                                readonly>

                        </div>

                        <button class="btn btn-primary">

                            Update Profile

                        </button>

                        <a href="{{ url_for('staff.dashboard') }}"
                           class="btn btn-secondary">

                            Back

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
